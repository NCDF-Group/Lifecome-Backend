# Reverse proxy for the LifeCome API. deploy.sh --first-time installs this with DOMAIN_PLACEHOLDER
# replaced by your domain, then (if CERTBOT_EMAIL is set) runs certbot, which rewrites this file to
# add the HTTPS server block and an HTTP->HTTPS redirect.

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN_PLACEHOLDER;

    # Bodies are small JSON; the largest is a base64 staff avatar (~700 KB). Fastify's own default
    # limit is 1 MB, so this is just a ceiling in front of it.
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, don't append: the API runs with trustProxy and takes the *first* entry as the
        # client IP (rate limiting uses it), so a client-supplied X-Forwarded-For must never survive.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Swagger UI is public by default (see main.ts). To restrict it to your own IP, uncomment:
    # location /api/docs {
    #     allow YOUR.IP.ADDRESS.HERE;
    #     deny all;
    #     proxy_pass http://127.0.0.1:3001;
    #     proxy_set_header Host $host;
    # }
}
